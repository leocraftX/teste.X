
<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Login</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body class="bg-light">

    <div class="container">

        <div class="row justify-content-center mt-5">

            <div class="col-md-5">

                <div class="card shadow">

                    <div class="card-body">

                        <h2 class="text-center mb-4">
                            Sistema de Alunos
                        </h2>

                        <h4 class="text-center mb-4">
                            Login
                        </h4>


                        <!-- Mensagens do Flask -->

                        {% with mensagens = get_flashed_messages(with_categories=true) %}

                            {% for categoria, mensagem in mensagens %}

                                <div class="alert alert-{{ categoria }}">
                                    {{ mensagem }}
                                </div>

                            {% endfor %}

                        {% endwith %}


                        <form method="POST" action="{{ url_for('fazer_login') }}">

                            <div class="mb-3">

                                <label class="form-label">
                                    E-mail
                                </label>

                                <input
                                    type="email"
                                    name="email"
                                    class="form-control"
                                    required>

                            </div>


                            <div class="mb-3">

                                <label class="form-label">
                                    Senha
                                </label>

                                <input
                                    type="password"
                                    name="senha"
                                    class="form-control"
                                    required>

                            </div>


                            <button
                                type="submit"
                                class="btn btn-primary w-100">

                                Entrar

                            </button>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </div>

</body>

</html>
